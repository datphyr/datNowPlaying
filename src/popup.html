<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SoundCloud Now Playing</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; }
    header { background: #f50; color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.55); }
    header .dot.on { background: #9cff9c; box-shadow: 0 0 6px #9cff9c; }
    header b { font-size: 13px; font-weight: 700; }
    main { padding: 14px; }
    .cover { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #eee; flex: 0 0 auto; }
    .track { display: flex; gap: 12px; align-items: center; }
    .meta { min-width: 0; }
    .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .state { margin-top: 4px; font-size: 12px; color: #888; }
    .folder { margin-top: 12px; padding: 8px 10px; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 7px; font-size: 12px; }
    .folder.warn { background: #fff4f0; border-color: #ffd3c2; color: #a33; }
    .actions { margin-top: 12px; display: flex; gap: 8px; }
    button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 7px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
    button.primary { background: #f50; border-color: #f50; color: #fff; }
  </style>
</head>
<body>
  <header><span id="dot" class="dot"></span><b>SoundCloud Now Playing</b></header>
  <main>
    <div class="track">
      <img id="cover" class="cover" alt="" />
      <div class="meta">
        <div id="title" class="title">—</div>
        <div id="artist" class="artist"></div>
        <div id="state" class="state">checking…</div>
      </div>
    </div>
    <div id="folder" class="folder">…</div>
    <div class="actions">
      <button id="open" class="primary">Settings</button>
      <button id="test">Test write</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
